[platformio]
default_envs = esp32dev

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; Use min_spiffs partition table to allocate ~1.9MB for each OTA application partition
board_build.partitions = min_spiffs.csv

lib_deps =
    tzapu/WiFiManager @ ^2.0.17
    knolleary/PubSubClient @ ^2.8

; Default environment
[env:esp32dev]
build_flags = -DESP_MODE=1

; Dedicated environments for multi-mode automated builds
[env:mode1]
build_flags = -DESP_MODE=1

[env:mode2]
build_flags = -DESP_MODE=2

[env:mode3]
build_flags = -DESP_MODE=3

[env:mode4]
build_flags = -DESP_MODE=4
