# ==============================================================================
# Nginx Virtual Host for manage.anashwartech.com
# Compatible with Ubuntu 22.04/24.04 LTS (Nginx 1.24.0)
# Reverse Proxy to Anashwar Enterprise Fleet Console (Port 8080)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name manage.anashwartech.com www.manage.anashwartech.com;

    # Allow custom .bin firmware uploads up to 32MB
    client_max_body_size 32M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket & Streaming support for real-time telemetry
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for OTA downloads and binary transfers
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }
}

